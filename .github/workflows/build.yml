name: Build, Lint and Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The locked Homebridge 2 development dependency supports Node 22 and 24.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint the project
        run: npm run lint

      - name: Build and run all tests
        run: npm test

  homebridge-1-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.17.0, 20.9.0]
    steps:
      - uses: actions/checkout@v4
      - name: Install and compile with the supported development runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/fixtures/homebridge-1/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install the locked Homebridge 1.6 fixture
        run: npm ci --prefix test/fixtures/homebridge-1
      - name: Use the advertised legacy plugin runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run all compiled tests with Homebridge 1 HAP
        env:
          SUPLA_TEST_HAP_PATH: ${{ github.workspace }}/test/fixtures/homebridge-1/node_modules/hap-nodejs
        run: node --test test/*.test.js
